# Docker DNS: без resolver nginx кэширует IP upstream при старте → после recreate frontend 502
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    location = /health {
        set $backend_host backend;
        proxy_pass http://$backend_host:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        set $frontend_host frontend;
        proxy_pass http://$frontend_host:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api {
        set $backend_host backend;
        proxy_pass http://$backend_host:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
