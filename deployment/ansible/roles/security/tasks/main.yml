---
- name: Configure UFW defaults
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow outbound by default
  community.general.ufw:
    policy: allow
    direction: outgoing

- name: Allow SSH port
  community.general.ufw:
    rule: allow
    port: "{{ security_ssh_port }}"
    proto: tcp

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
  when: security_allow_http | bool

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
  when: security_allow_https | bool

- name: Ensure Fail2Ban is enabled
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
