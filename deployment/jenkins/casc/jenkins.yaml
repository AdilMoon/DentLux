jenkins:
  systemMessage: "DentLux CI/CD Infrastructure - Corporate Level"
  numExecutors: 2
  scmCheckoutRetryCount: 2
  mode: NORMAL

unclassified:
  location:
    url: http://localhost:8086/

# Job DSL через JCasC: job dentlux-ci создаётся/обновляется при старте Jenkins.
# Приватный репозиторий: Manage Jenkins → Credentials → id dentlux-github (PAT),
# затем в remote { } добавьте: credentials('dentlux-github')
jobs:
  - script: |
      pipelineJob('dentlux-ci') {
        displayName('DentLux CI')
        description('GitHub → npm ci / Prisma → tests → docker compose build (backend + frontend)')
        logRotator {
          numToKeep(30)
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/AdilMoon/DentLux.git')
                }
                branch('*/main')
              }
            }
            scriptPath('deployment/jenkins/Jenkinsfile.dentlux')
          }
        }
      }
  - script: |
      pipelineJob('dentlux-infra-cd') {
        displayName('DentLux Infra CD (Terraform + Ansible)')
        description('Terraform AWS plan/apply/destroy + Ansible deployment + smoke checks')
        logRotator {
          numToKeep(30)
        }
        parameters {
          choiceParam('TF_ACTION', ['plan', 'apply', 'destroy'], 'Terraform action for infrastructure lifecycle')
          booleanParam('RUN_ANSIBLE_DEPLOY', true, 'Run Ansible deployment after successful terraform apply')
          stringParam('TF_VARS_FILE', 'terraform.tfvars', 'Path to tfvars from deployment/terraform/aws')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/AdilMoon/DentLux.git')
                }
                branch('*/main')
              }
            }
            scriptPath('deployment/jenkins/Jenkinsfile.infra')
          }
        }
      }